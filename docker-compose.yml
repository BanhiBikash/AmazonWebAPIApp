version: '3.8'

services:
  # 1. The SQL Server Database Container
  amazon-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: amazon-sql-db
    # Enforce the resource cap directly inside the Compose file
    mem_limit: 2000m 
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123!
      - MSSQL_MEMORY_LIMIT_MB=1500 # Restricts internal SQL buffer pool
    ports:
      - "1433:1433"
    volumes:
      - amazon_sql_data:/var/opt/mssql

  # 2. Your .NET Web API Container
  backend:
    image: amazon-backend:v1
    container_name: amazon-backend-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7130:8080" # Maps local browser port 7130 to internal container port 8080
    depends_on:
      - amazon-db # Fixed the accidental "depends_on:ama" typo here
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Target connection string mapping directly to the containerized database
      - ConnectionStrings__DefaultConnection=Server=amazon-db;Database=AmazonDatabase;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
      # Environment overrides for CORS and tokens
      - CorsSettings__AllowedOrigins=https://localhost:5130
      - JwtSettings__Issuer=https://localhost:7130
      - JwtSettings__Audience=https://localhost:5130

  #3: Frontend-React
  amazon-react:
    image: amazon-react:v1
    container_name: amazon-frontend-api
    ports:
      - "5173:5173"

volumes:
  amazon_sql_data: # Keeps your restored database safe even when the container is stopped