version: '3.8'

services:
  # 1. The SQL Server Database Container
  amazon-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: amazon-sql-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123! # Keep this matching across your setup
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  # 2. Your .NET Web API Container
  backend:
    image: amazon-backend:v1
    container_name: amazon-backend-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080" # Maps your local browser port 5000 to internal container port 8080
    depends_on:
      - amazon-db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Target connection string mapping directly to the containerized database
      - ConnectionStrings__DefaultConnection=Server=amazon-db;Database=AmazonDatabase;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
      # Environment overrides for CORS and tokens
      - CorsSettings__AllowedOrigins=http://localhost:3000
      - JwtSettings__Issuer=http://localhost:5000
      - JwtSettings__Audience=http://localhost:5000

volumes:
  sql_data: # Keeps your restored tuples safe even when the container is stopped